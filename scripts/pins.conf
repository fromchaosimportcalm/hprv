# HPRV — pinned upstream commits (Phase B)
#
# These two SHAs determine what the server actually is. The module
# REQUIRES the matching AzerothCore fork, and per-raid bot strategy
# support moves commit to commit — so the build is only reproducible if
# both are pinned together. Committed deliberately; this file is the
# reproducibility artifact referenced by CLAUDE.md Phase B step 3.
#
# ---------------------------------------------------------------------
# Upstream moved orgs. `liyunfan1223/*` now redirects to `mod-playerbots/*`
# (verified 2026-08-05 via the GitHub API). GitHub redirects are
# best-effort and break if anyone re-creates the old name, so the
# canonical org is used here. Same project, same maintainer lineage —
# the CLAUDE.md rule ("NOT stock AzerothCore") is unchanged.
# ---------------------------------------------------------------------

