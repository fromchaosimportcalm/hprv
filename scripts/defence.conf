# HPRV — how to count a tank's defence rating. Sourced by roster-status.sh
# and hprv-spec.sh, so the two reports can never disagree about whether a
# tank is crit-immune.
#
# Defence comes from three places, and only the first is in item_template:
#   1. the item's own stats              item_template.stat_type* = 12
#   2. enchants, gems, socket bonuses    item_instance.enchantments
#   3. random "of Defense" properties    item_instance.enchantments too
#
# Before 2026-09-26 both scripts counted only (1), so a tank with
# enchants and gems read low. Ararin showed 442 while he was really 455.
#
# item_instance.enchantments is 12 slots x (id duration charges), all
# counted: 0 permanent, 1 temporary, 2-4 gems, 5 socket bonus (stored only
# while the gem colours match), 6 prismatic, 7-11 random-property slots.
#
# DEFENCE_ENCHANTS is every SpellItemEnchantment.dbc row with a
# defence-rating stat (type 5, arg 12), as id:rating. Generated from
# /mnt/hprv/data/dbc on 2026-09-26 (106 rows). Regenerate only if the
# client data changes.
#
# Known gap: random SUFFIX items ("of the Knight"-style, negative
# randomPropertyId) scale their stats from the item's suffix factor, not
# the DBC amount, so their defence is not counted. No tank wears one today.

DEFENCE_ENCHANTS="38:5,110:1,111:2,112:3,113:4,114:5,115:6,116:7,923:5,924:2,925:3,1943:12,1944:8,1945:9,1946:10,1947:11,1948:13,1949:14,1950:15,1951:16,1952:20,1953:22,1954:25,1955:32,1956:17,1957:18,1958:19,1959:21,1960:23,1961:24,1962:26,1963:27,1964:28,1965:29,1966:30,1967:31,1968:33,1969:34,1970:35,1971:36,1972:37,1973:38,2503:5,2583:10,2584:10,2648:12,2696:6,2706:3,2737:8,2743:4,2793:8,2833:12,2861:3,2932:4,2968:4,2976:2,2978:10,2990:13,2991:15,2999:16,3000:12,3053:5,3056:4,3073:5,3075:4,3078:5,3082:5,3130:10,3145:5,3221:12,3274:12,3302:8,3384:12,3407:6,3418:6,3419:6,3421:6,3430:6,3461:16,3479:8,3495:8,3496:8,3498:8,3502:8,3529:20,3551:10,3568:10,3569:10,3571:10,3575:10,3630:21,3631:21,3658:14,3683:7,3694:7,3695:7,3697:7,3700:7,3743:34,3751:6,3777:20,3811:15,3818:20,3837:15,3857:6,3876:10"

# 490 skill = 350 + floor(rating / 2.37). The game's divisor at 70 is
# 2.3654, so this is slightly conservative, never optimistic.
defence_skill_from_rating() {
    awk -v r="$1" 'BEGIN{printf "%d", 350 + int(r/2.37)}'
}

# defence_rating_sql <chars_db> <world_db> <character guid>
# Prints one query returning two columns: item rating, enchant rating.
defence_rating_sql() {
    local cdb="$1" wdb="$2" g="$3" p map=""
    for p in ${DEFENCE_ENCHANTS//,/ }; do
        map+="${map:+ UNION ALL }SELECT ${p%%:*} id, ${p##*:} def"
    done
    cat <<SQL
SELECT
  (SELECT IFNULL(SUM(
      CASE WHEN t.stat_type1=12  THEN t.stat_value1  ELSE 0 END +
      CASE WHEN t.stat_type2=12  THEN t.stat_value2  ELSE 0 END +
      CASE WHEN t.stat_type3=12  THEN t.stat_value3  ELSE 0 END +
      CASE WHEN t.stat_type4=12  THEN t.stat_value4  ELSE 0 END +
      CASE WHEN t.stat_type5=12  THEN t.stat_value5  ELSE 0 END +
      CASE WHEN t.stat_type6=12  THEN t.stat_value6  ELSE 0 END +
      CASE WHEN t.stat_type7=12  THEN t.stat_value7  ELSE 0 END +
      CASE WHEN t.stat_type8=12  THEN t.stat_value8  ELSE 0 END +
      CASE WHEN t.stat_type9=12  THEN t.stat_value9  ELSE 0 END +
      CASE WHEN t.stat_type10=12 THEN t.stat_value10 ELSE 0 END), 0)
     FROM ${cdb}.character_inventory i
     JOIN ${cdb}.item_instance ii ON ii.guid = i.item
     JOIN ${wdb}.item_template t ON t.entry = ii.itemEntry
    WHERE i.guid = ${g} AND i.bag = 0 AND i.slot < 19),
  (SELECT IFNULL(SUM(e.def), 0)
     FROM ${cdb}.character_inventory i
     JOIN ${cdb}.item_instance ii ON ii.guid = i.item
     JOIN (SELECT 0 k UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3
           UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7
           UNION ALL SELECT 8 UNION ALL SELECT 9 UNION ALL SELECT 10 UNION ALL SELECT 11) s
     JOIN (${map}) e
       ON e.id = CAST(SUBSTRING_INDEX(SUBSTRING_INDEX(ii.enchantments, ' ', s.k*3 + 1), ' ', -1) AS UNSIGNED)
    WHERE i.guid = ${g} AND i.bag = 0 AND i.slot < 19);
SQL
}
