# HPRV — TODO item 2: gear the ten and the 15, each at its own tier
#
#   hprv-spec.sh --batch gear-rounds.conf <round>
#   ... paste the printed lines in game ...
#   hprv-spec.sh --restore
#
# Then the next round. One round at a time: the script refuses to force a
# second round while the first is still live.
#
# Caps are gear scores (score = ilvl x 1.4641 for an epic, truncated):
#   168  the ten, best pre-raid       admits epics to ilvl 115
#   183  the 15, Karazhan cleared     admits epics to ilvl 125
#
# The forced spec table is per class, so a round holds ONE spec per class.
# Same-spec characters at different caps share a round (Krast + Irntifumm).
#
# Rounds also keep apart the characters that share an rndbot account
# (Tanke/Sehjece on 98, Dehme/Lomul on 90, Vestanza/Tengwe on 89). Whether
# two bots on one account can be online together is unverified, and this
# costs nothing.
#
# Not here, and why:
#   Bullwark   geared by hand, never init= (docs/bullwark-gear.md)
#   Fimur      level 1. Summon him once to auto-level, then a single
#              `hprv-spec.sh Fimur "enh pve" --quality 183`
#   bench      decision D: nothing until one is swapped in
#
# Crumm is FROST from this pass on (2026-09-26). A frost DK carries no
# TANK-typed strategy, so he needs no rule-1 conversion. Ararin is the only
# tank spec below, and the script prints his whispers.
#
# ROUND NAME         CAP  SPEC

