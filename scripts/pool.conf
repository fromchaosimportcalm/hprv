# ---------------------------------------------------------------------
# THE SPREAD — weighted toward hybrids on purpose.
#
#   paladin 5   tank / heal / melee        16 bodies can tank
#   druid   5   tank / heal / ranged/melee  19 bodies can heal
#   shaman  5   heal / melee / ranged
#   priest  4   heal / ranged
#   warrior 4   tank / melee
#   mage    4   ranged
#   warlock 4   ranged
#   hunter  4   ranged
#   rogue   3   melee
#   dk      2   tank / melee
#   --
#   40
#
# A hybrid body is worth more than a pure one in a rotatable pool because
# switching its role costs a gear pass rather than a different character.
# That is why the pure-DPS classes are the ones capped at 3-4.
# ---------------------------------------------------------------------

