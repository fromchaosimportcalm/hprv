# HPRV — the 40-character pool
#
# Every character here lives on CLINTON's own account (id 101), which is
# what makes the whole design work. See docs/pool.md for the why; the
# short version is three independent gates:
#
#   gearable          IsAccountType(101, 2)  -> a row in
#                     playerbots_account_type. A plain table lookup, so it
#                     works for any account, not just rndbot ones.
#   never re-geared   IsRandomBot() requires the account name to match
#                     'rndbot%'. "CLINTON" never will, so the ambient
#                     random system cannot touch these characters' gear.
#   auto-login        BotAutologin=1 adds every character on YOUR account
#                     when you log in. Own-account only — this is the
#                     reason the pool lives here rather than on dedicated
#                     HPRVPOOL* accounts.
#
# AUTO-LOGIN IS ALL-OR-NOTHING. All 40 come up every time you log in.
# There is no subsetting: the module runs a bare
# `SELECT name FROM characters WHERE account = <yours>` and adds the lot.
# Rotation therefore means "who gets invited to the raid", not "who is
# logged in". The 15-odd not in your group are cheap — LogInGroupOnly=1
# stops a bot running its full AI unless it is grouped with a real player
# master.

POOL_ACCOUNT_ID=101
POOL_ACCOUNT_NAME="CLINTON"
MASTER_NAME="Bullwark"
MASTER_CLASS="warrior"
MASTER_SPEC="prot pve"

# ---------------------------------------------------------------------
# FACTION IS A HARD CONSTRAINT AND IT IS EASY TO GET WRONG.
#
# Bullwark is a Tauren (race 6) — HORDE. Every character below is Horde
# (races 2 Orc, 5 Undead, 6 Tauren, 8 Troll, 10 Blood Elf). The AddClass
# pool is roughly half Alliance and those characters can never group with
# him. If you ever draw a replacement by hand, filter on race first.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# THE SPREAD — weighted toward hybrids on purpose.
#
#   paladin 5   tank / heal / melee        16 bodies can tank
#   druid   5   tank / heal / ranged/melee  19 bodies can heal
#   shaman  5   heal / melee / ranged
#   priest  4   heal / ranged
#   warrior 4   tank / melee
#   mage    4   ranged
#   warlock 4   ranged
#   hunter  4   ranged
#   rogue   3   melee
#   dk      2   tank / melee
#   --
#   40
#
# A hybrid body is worth more than a pure one in a rotatable pool because
# switching its role costs a gear pass rather than a different character.
# That is why the pure-DPS classes are the ones capped at 3-4.
# ---------------------------------------------------------------------

# Format:  NAME:CLASS:HOME_SPEC:OFFSPECS:STATUS
#   HOME_SPEC  what it runs by default
#   OFFSPECS   what `hprv-spec.sh` will switch it to (pipe-separated)
#   STATUS     ready | needs-init  (level 1, wants a full init= pass)
#
# HOME_SPEC for the 29 existing level-70s is what they ACTUALLY run,
# measured on the box 2026-08-13 — not an intention. The 10 level-1 draws
# and Restofarian carry an assigned home spec that is not true yet.

