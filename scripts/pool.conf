# ---------------------------------------------------------------------
# WHERE THE CHARACTERS LIVE — and why it is 10, not 40.
#
# The client renders at most 10 characters per realm. CharactersPerRealm
# is validated `> 0 && <= 10` and documented "(Client limitation)"; the
# cap is enforced only at character creation, never at enum, so an
# account holding more than 10 sends them all and the client answers
# "Error retrieving character list".
#
# ACCOUNT 101 (yours) — 10 characters, and they AUTO-LOGIN with you.
# This is a standing 10-man raid that costs no commands:
#
#   Bullwark      human prot warrior   MAIN TANK
#   Ararin        prot paladin         off-tank (converted, 511 defence)
#   Nathos        holy paladin         heal
#   Krast         resto shaman         heal
#   Tanke         resto druid          heal
#   Restofarian   resto druid          heal
#   Izri          mage                 ranged
#   Dijito        shadow priest        ranged
#   Ilyna         hunter               ranged
#   Anmine        rogue                melee
#
# EVERYONE ELSE — stays on their type-2 rndbot account and is summoned by
# name. They lose nothing by living there:
#
#   gearable        yes — IsAccountType(id, 2) is a table lookup and
#                   those accounts are type 2
#   churn-safe      yes — the ambient pool is built from type-1 accounts
#                   only, and IsRandomBot() also requires membership in
#                   currentBots, which type-2 characters never have
#   auto-login      no  — own-account only
#   group persist   no  — KeepAltsInGroup skips rndbot-named accounts
#
# So the ONLY thing account 101 buys is auto-login and group persistence.
# That is worth the 9 slots; it is not worth breaking the character list.
#
# TO SWAP a bot into the standing ten, move one out first. Never exceed
# 10 — see scripts/migrate-pool.sql SECTION 2.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# AUTO-GEAR ON LOGIN — measured 2026-08-13, and it removes a manual step.
#
# OnBotLogin carries this, and it fires for anything on a type-2 account:
#
#   bool addClassBot = IsAccountType(accountId, 2);
#   if (addClassBot && master && abs(master->GetLevel() - bot->GetLevel()) > 3)
#       PlayerbotFactory(bot, master->GetLevel(), ITEM_QUALITY_LEGENDARY,
#                        mixedGearScore).Randomize(false);
#
# So a level-1 draw logging in behind a level-70 master is levelled,
# geared and specced with NO pass at all. Verified on Gerina: level 1 ->
# 70, avg ilvl 138 epics, in one login.
#
# TWO CONSEQUENCES.
#
# 1. The nine remaining level-1 draws need no gearing work. Log in, and
#    they arrive at tier. But the SPEC IS ROLLED AT RANDOM by
#    RandomClassSpecProb — Gerina landed on arms, which is what this file
#    wanted, at a 20% chance. Assume the other nine will not be so lucky
#    and budget one hprv-spec.sh pass each to set the intended spec.
#
# 2. Characters already at the master's level are NOT touched — the gap
#    must exceed 3. Netohje (70, behind a 70 master) came through the
#    migration with his gear bit-for-bit unchanged. That is what makes
#    migrating the 29 geared veterans safe.
#
# ---------------------------------------------------------------------
# GEAR STATE AT MIGRATION (avg equipped ilvl, measured 2026-08-13)
#
# The tier is AutoGearScoreLimit = 141. Most of the pool sits at 134-139.
# These are the ones that do not, and they are all VETERANS carrying gear
# from the old 125-era limit:
#
#   Netohje      115   quality 3 (BLUE) — and dual-wielding, so he is
#                      fury-geared, NOT the crit-immune prot tank the old
#                      notes claim. He is the designated bot-mode main
#                      tank and cannot do that job as he stands.
#   Ararin       123   FIXED 2026-08-14 — now 511 defence skill, 21 clear
#                      of the floor. Brooch of the Immortal King equipped
#                      (the displaced trinket is in the BANK so he cannot
#                      re-equip it), plus ilvl 141 boots and bracers that
#                      replaced zero-defence 115s. See fix-tank-defence.sql
#   Anmine       122
#   Restofarian  122
#   Tanke        127
#   Celerina     127
#
# Note the irony before you plan around it: the level-1 draws come out of
# auto-gear at ~138, BETTER than five of the veterans. Fixing a veteran is
# an hprv-spec.sh pass — but on Ararin that also wipes his hand-picked
# defence items and clears his `co` conversion, so read TANK MODE and the
# DEFENCE FLOOR note below before touching him.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# TANK MODE — the switch that rule 1 forces on you.
#
# A bot tank and a human tank CANNOT share a raid. Both tank strategies
# wire LoseAggroTrigger straight to a taunt, and a bot tank's `tank
# assist` points it at the master's target — so while you hold the boss
# the trigger is permanently satisfied and it taunts on cooldown, all
# night. No threat setting reaches it.
#
# So "offspecs for tanking" means the pool supports two mutually
# exclusive modes, and hprv-spec.sh takes --mode to pick one:
#
#   human   (default)  You main-tank on Bullwark. Every plate body in the
#                      raid keeps tank spec and tank gear but is CONVERTED
#                      with `co -tank,-tank assist,+dps,+dps assist`, so
#                      IsTank() goes false. They off-tank adds by damage
#                      threat, keep crit immunity, and never taunt.
#                      Do NOT whisper `co -threat` in this mode — with one
#                      real tank the global +threat cap works correctly and
#                      removing it just uncaps your DPS.
#
#   bot                You play something else (Restofarian, or a DPS).
#                      Netohje main-tanks; a second plate body assist-tanks
#                      if the fight wants one. Neither is converted.
#                      AT TWO BOT TANKS, whisper `co -threat` to BOTH —
#                      ThreatValue scales each tank against the OTHER
#                      tanks, so a pair mutes each other and neither holds
#                      anything.
#
# The conversion is PERSISTENT (playerbots_db_store key "co"), so it is
# applied once per character, not per session — and it must be cleared
# with `co !` before any pass that re-rolls that character's spec, or it
# comes back running the old spec's strategies. hprv-spec.sh does this.
# ---------------------------------------------------------------------

TANK_MODE_HUMAN_CONVERT="Ararin,Daedana,Crumm,Rechiw,Caugotsa"
TANK_MODE_BOT_MAINTANK="Netohje"
TANK_MODE_BOT_ASSIST="Ararin"

# ---------------------------------------------------------------------
# THE DEFENCE FLOOR SURVIVES NOTHING.
#
# 490 defence skill is what makes a tank crit-immune against a level 73
# boss. StatsWeightCalculator scores raw stats and has no concept of
# defence skill or its cap, so EVERY init= pass fills trinkets, neck and
# shield with zero-defence pieces and drops the character back under the
# floor. This is not a bug you can configure away.
#
# Consequence: switching a character INTO a tank spec always costs a
# hand-itemisation step afterwards. hprv-spec.sh prints the check and the
# .additem lines; it cannot skip them.
#
# Measured 2026-08-13 — all three current off-tanks are already under:
#   Ararin 476, Crumm 475, Rechiw 447   (Bullwark is fine at 534)
# ---------------------------------------------------------------------

DEFENCE_FLOOR=490
