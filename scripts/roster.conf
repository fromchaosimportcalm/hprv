# ---------------------------------------------------------------------
# BALANCE
#
#    1  human main tank           Bullwark
#    3  converted plate off-tanks  Ararin, Crumm, Rechiw
#    7  healers                    Nathos, Krast, Tanke, Dehme, Olidina,
#                                  Irntifumm, Mutlie
#    4  melee                      Anmine, Ralda, Zaene, Muhnun
#   10  ranged                     Izri, Lomul, Dijito, Celerina, Ilyna,
#                                  Sehjece, Fehmos, Tengwe, Vestanza,
#                                  Grohtarty
#   --
#   25  bodies
#
# That covers the shape most TBC endgame content asks for: plenty of
# ranged for Gruul-style spread and Magtheridon's cube duty, three plate
# bodies that hold adds without stealing the boss, and enough healing to
# cover a human main tank who is actually taking the damage.
#
# SEVEN HEALERS IS GENEROUS for 25-man, and it is that way by accident —
# five of the seven are pool draws that happened to roll healing specs.
# It is the safe direction to be wrong in while content is untuned, and
# it is the obvious place to find two more DPS if the raid ever feels
# slow. Re-rolling one is a gear-pass.sh job (a respec never re-gears),
# and any bot carrying a `co` override must be cleared with `co !` first.
#
# NOBODY IS BENCHED. The bench flags that used to live here existed to
# hold the raid at ten bodies for Karazhan. At 25 there is no cap to
# hold, so BOT_nn_BENCH is unused — roster-status.sh still honours it if
# you set one.
# ---------------------------------------------------------------------

