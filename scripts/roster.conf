# ---------------------------------------------------------------------
# CONVERTED — the three plate off-tanks
#
# Ararin, Crumm and Rechiw all arrived tank-specced. Left alone, each
# would taunt bosses off Bullwark on cooldown all night (CLAUDE.md rule
# 1 — measured on Crumm: `dark command` pushed 3,651 times, executed 49).
#
# Each was converted out of tankhood in the AI, once:
#
#   /w <bot> co -tank,-tank assist,+dps,+dps assist
#
# RECHIW IS NOT ACTUALLY CONVERTED. Verified 2026-08-14: he has ZERO
# rows in playerbots_db_store, and his talents include Rune Tap (48982),
# Mark of Blood (49005) and Vampiric Blood (55233) — deep blood TANK
# talents. With no override, AiFactory grants him the full tank strategy
# set from spec on every login. He has been taunting off Bullwark in
# every 25-man. Fix, once, next time he is in the raid:
#
#   /w Rechiw co -tank,-tank assist,+dps,+dps assist
#
# THE 2026-08-13 VERIFICATION PASSED VACUOUSLY, and this is the lesson:
# it asked whether anyone CARRIES `+tank` or `+tank assist`, and a bot
# with no rows at all answers "no" while running them from spec.
# ABSENCE OF A `co` ROW IS NOT EVIDENCE OF CONVERSION — IT IS EVIDENCE
# OF THE OPPOSITE. Assert the row is present, never that the string is
# missing:
#
#   SELECT c.name, s.value FROM acore_playerbots.playerbots_db_store s
#     JOIN acore_characters.characters c ON c.guid = s.guid
#    WHERE s.`key` = 'co' AND c.name = 'Rechiw';
#
# Ararin and Crumm are genuinely converted — re-verified 2026-08-14,
# both carry a row and neither holds `+tank` or `+tank assist`. They DO
# carry `+tank face`, which is an unrelated facing strategy — do not
# "fix" it. Both also carry `+pull` and `+pull back`, frozen in from
# their tank-spec days by rule 2; that is a capability, not a bug.
#
# They keep blood/prot talents, tank gear and crit immunity, and off-tank
# by damage threat instead of by taunt. At 25-man that is an asset, not a
# compromise — Supremus, Gorefiend and the Illidari Council all want
# extra plate bodies that hold an add without stealing the boss.
#
# THE CONVERSION PERSISTS. It survives relogs and outranks later spec
# changes. Do not re-whisper it nightly. DO clear it with `co !` before
# any gear pass that re-rolls one of their specs, or they will come back
# running the old spec's strategies with no warning.
#
# KNOWN INCONSISTENCY: Ararin carries both `+dps` and `+dps assist`;
# Crumm and Rechiw carry only `+dps assist`. The prescribed whisper
# includes both. Whether the bare `+dps` matters for a DK off-tank's
# output is untested — if Crumm and Rechiw look passive between add
# packs, that is the first thing to try:
#     /w Crumm  co +dps
#     /w Rechiw co +dps
# ---------------------------------------------------------------------

# Who is ACTUALLY converted — verified present in playerbots_db_store
# 2026-08-14, not inferred from the absence of `+tank`.
CONVERTED_TANKS="Ararin,Crumm"

# Tank-specced and still unconverted. Whisper before the next 25-man.
UNCONVERTED_TANKS_PENDING="Rechiw"

