# ---------------------------------------------------------------------
# CONVERSION STATE: assert the row, never its absence (CLAUDE.md rule 1)
#
#   SELECT c.name, s.`key`, s.value FROM acore_playerbots.playerbots_db_store s
#     JOIN acore_characters.characters c ON c.guid = s.guid
#    WHERE s.`key` IN ('co','nc') ORDER BY c.name, s.`key`;
#
# Neither row may contain tank / blood / bear / tank assist.
# ---------------------------------------------------------------------

