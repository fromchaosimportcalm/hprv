# ---------------------------------------------------------------------
# SUMMON — two lines, pasted in game. Not one: 24 names plus the command
# is ~190 characters and the chat input is not a place to discover a
# length limit. `roster-status.sh` prints these ready to paste.
#
#   .playerbots bot add Ararin,Nathos,Krast,Tanke,Izri,Lomul,Dijito,Celerina,Ilyna,Anmine,Sehjece,Crumm
#   .playerbots bot add Rechiw,Ralda,Zaene,Muhnun,Fehmos,Dehme,Olidina,Irntifumm,Mutlie,Tengwe,Vestanza,Grohtarty
#
# 24 bots + Bullwark = 25. MaxAddedBots is 40, so there is room.
# The command is `.playerbots bot`, NOT `.bot`. There is no such alias.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# RAID LOCKOUTS BIND TO THESE EXACT NAMES.
#
# character_instance rows are per-character. Re-summoning THESE names
# puts the raid back where it left off with bosses still dead. Summoning
# different bots does not — they are unbound, and the raid resets in
# usefulness even though the lockout itself survives. That is the whole
# reason the names are written down.
