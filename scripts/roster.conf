# HPRV — the raid, 25 bodies
#
# Sourced by roster-status.sh and by gear-pass.sh. This file exists for
# one reason: bots do not survive a master logout (CLAUDE.md rule 4) and
# `.playerbots bot addclass` draws from an unordered set, so it will not
# hand back the same characters. Without these names written down, last
# night's raid is gone and the lockout with it.
#
# Composition verified live on the box 2026-08-13 — name, class and
# account read from acore_characters / acore_auth, not from memory.

MASTER_NAME="Bullwark"
MASTER_CLASS="warrior"
MASTER_SPEC="prot pve"

# ---------------------------------------------------------------------
# THE HUMAN IS THE MAIN TANK, and that is load-bearing (CLAUDE.md rule 1).
#
# No raid-frame flag is REQUIRED when the human tanks: IsTank() is true
# for a human prot warrior via the spec fallback, so GetMainTankGuid()
# resolves to Bullwark on its own once the plate bots are converted.
#
# BUT "no flag is required" is not "no flag is set", and this file used
# to say "do not flag anyone" as though it were. GetMainTankGuid() reads
# MEMBER_FLAG_MAINTANK FIRST and returns it without checking IsTank() —
# a stale flag beats the fallback silently. Found on Ararin 2026-08-15.
# Audit the flags (CLAUDE.md rule 6) and set them deliberately whenever
# a bot tanks. ADR 0003.
#
# Bullwark is NEVER re-rolled. He is the only body in the raid with
# hand-verified defence itemization — StatsWeightCalculator scores raw
# stats and has no concept of defence skill or its cap, so an automated
# pass fills trinkets, neck and shield with zero-defence pieces and drops
# him under the floor. gear-pass.sh refuses to print an `initself=` line
# for him.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# ABOUT THE SPEC FIELD
#
# BOT_nn_SPEC is the WANTED spec. roster-status.sh reports SPEC MISMATCH
# against it, and an empty value suppresses that check.
#
# EVERY SPEC HERE WAS READ OFF THE BOX ON 2026-08-13, not chosen from a
# plan. The baseline is what the raid actually is, because that is the
# thing that works. From here the mismatch column is a real drift
# detector: anything it flags is a change since that date.
#
# Slots 01-11 were originally chosen deliberately; 12-24 were drawn from
# the AddClass pool mid-session. Three of the curated slots had already
# drifted from their original intent by the time this was recorded, and
# the measured value won:
#   Izri     intended arcane  -> is frostfire
#   Lomul    intended fire    -> is arcane
#   Sehjece  intended enh     -> is elemental (so his ROLE is ranged now,
#                                not melee — the role follows the spec)
# If you want the original intent back, that is a gear-pass.sh job, not
# an edit here: a respec never re-gears.
# ---------------------------------------------------------------------

